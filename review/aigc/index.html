<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIGC 影像审阅｜镜头笔记</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <style>
    :root { color-scheme: dark; background: #030205; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; visibility: hidden; color: #fff; background: #030205; }
    body.is-authorized { visibility: visible; }
    a { color: inherit; }
    header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 70px; padding: 14px clamp(18px, 5vw, 64px); border-bottom: 1px solid rgba(255,255,255,.09); background: rgba(3,2,5,.84); backdrop-filter: blur(18px); }
    .brand { text-decoration: none; font-weight: 900; letter-spacing: -.02em; }
    .header-actions { display: flex; align-items: center; gap: 14px; }
    .session { color: rgba(255,255,255,.4); font: 700 9px/1.4 ui-monospace, monospace; letter-spacing: .14em; }
    .logout { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 9px 13px; color: rgba(255,255,255,.7); background: transparent; font: 700 10px/1 ui-monospace, monospace; cursor: pointer; }
    body.is-embedded .brand { visibility: hidden; }
    main { width: min(1440px, 100%); margin: 0 auto; padding: clamp(50px, 8vw, 100px) clamp(18px, 5vw, 64px) 90px; }
    .eyebrow { margin: 0 0 12px; color: #ccff00; font: 700 11px/1.4 ui-monospace, monospace; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(44px, 8vw, 104px); line-height: .84; letter-spacing: -.065em; }
    .lead { max-width: 760px; margin: 28px 0 0; color: rgba(255,255,255,.5); font-size: 14px; line-height: 1.9; }
    .notice { margin-top: 34px; padding: 16px 18px; border: 1px solid rgba(255,193,7,.2); border-radius: 16px; color: rgba(255,235,190,.68); background: rgba(255,174,0,.055); font-size: 12px; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 3vw, 34px); margin-top: 50px; }
    .card { overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: #09060d; box-shadow: 0 24px 55px rgba(0,0,0,.26); }
    .preview { position: relative; display: block; width: 100%; aspect-ratio: 16/9; padding: 0; border: 0; overflow: hidden; color: #fff; background: #08060b; cursor: pointer; }
    .preview img { width: 100%; height: 100%; object-fit: cover; transition: transform .65s cubic-bezier(.16,1,.3,1), filter .4s ease; }
    .preview:hover img { transform: scale(1.025); filter: brightness(1.08); }
    .preview::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.08) 45%, rgba(0,0,0,.68)); }
    .play { position: absolute; z-index: 2; left: 50%; top: 50%; display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; color: rgba(255,255,255,.92); background: rgba(5,5,7,.56); transform: translate(-50%,-50%); box-shadow: 0 8px 24px rgba(0,0,0,.28); backdrop-filter: blur(10px); transition: color .25s ease, background .25s ease, border-color .25s ease, transform .25s ease; }
    .play::before { content: ''; width: 0; height: 0; margin-left: 4px; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid currentColor; }
    .preview:hover .play, .preview:focus-visible .play { color: #050505; background: rgba(255,255,255,.94); border-color: rgba(255,255,255,.94); transform: translate(-50%,-50%) scale(1.04); }
    .badges { position: absolute; z-index: 2; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { padding: 7px 9px; border: 1px solid rgba(204,255,0,.28); border-radius: 999px; color: #ccff00; background: rgba(5,5,5,.68); font: 800 8px/1 ui-monospace, monospace; letter-spacing: .1em; backdrop-filter: blur(10px); }
    .badge.alt { border-color: rgba(255,205,130,.3); color: #ffe0a8; }
    .copy { padding: 22px 22px 25px; }
    .copy h2 { margin: 0; font-size: clamp(20px, 3vw, 28px); letter-spacing: -.035em; }
    .copy p { margin: 12px 0 0; color: rgba(255,255,255,.46); font-size: 12px; line-height: 1.75; }
    .loading, .error { margin-top: 50px; padding: 42px 20px; border: 1px solid rgba(255,255,255,.09); border-radius: 22px; color: rgba(255,255,255,.5); text-align: center; }
    dialog { width: min(1120px, calc(100% - 24px)); padding: 0; border: 1px solid rgba(255,255,255,.15); border-radius: 20px; overflow: hidden; color: #fff; background: #050505; box-shadow: 0 50px 140px rgba(0,0,0,.78); }
    dialog::backdrop { background: rgba(0,0,0,.82); backdrop-filter: blur(12px); }
    dialog video { display: block; width: 100%; max-height: 80svh; background: #000; }
    .modal-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .modal-title { margin: 0; font-size: 14px; }
    .close { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; color: #fff; background: rgba(255,255,255,.05); font-size: 14px; line-height: 1; cursor: pointer; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .session { display: none; } h1 { line-height: .9; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" id="public-return" href="/#gallery">镜头笔记 / LIN</a>
    <div class="header-actions">
      <span class="session">PRIVATE REVIEW</span>
      <button class="logout" id="logout" type="button">退出审阅</button>
    </div>
  </header>
  <main>
    <p class="eyebrow">AI-GENERATED CONTENT / INVITATION ONLY</p>
    <h1>AIGC<br>VIDEO REVIEW</h1>
    <p class="lead">以下为个人 AIGC 影像创作记录，仅供受邀招聘人员评估镜头、节奏、合成与视觉设计能力。</p>
    <div id="notice" class="notice">正在获取受限内容…</div>
    <div id="loading" class="loading">正在建立临时媒体授权…</div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <dialog id="player-dialog">
    <div class="modal-bar">
      <h2 id="player-title" class="modal-title">AIGC 影像</h2>
      <button id="close-player" class="close" type="button" aria-label="关闭">×</button>
    </div>
    <video id="player" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline preload="metadata"></video>
  </dialog>

  <script>
    const grid = document.getElementById('grid');
    const loading = document.getElementById('loading');
    const notice = document.getElementById('notice');
    const dialog = document.getElementById('player-dialog');
    const player = document.getElementById('player');
    const playerTitle = document.getElementById('player-title');
    const TOKEN_REFRESH_THRESHOLD_SECONDS = 2 * 60;
    const SESSION_HEARTBEAT_INTERVAL = 30 * 60 * 1000;
    const tokenCache = new Map();
    const tokenRequests = new Map();
    let activeItem = null;
    let activeToken = null;
    let activeTokenRefreshTimer = 0;
    let lastSessionActivity = Date.now();
    let refreshingActiveToken = false;
    const isEmbedded = new URLSearchParams(location.search).get('embedded') === '1';
    if (isEmbedded) document.body.classList.add('is-embedded');

    function requestLogin() {
      if (isEmbedded) {
        window.parent.postMessage({ type: 'review-session-expired' }, location.origin);
      } else {
        location.replace(`/review-login/?next=${encodeURIComponent(location.pathname)}`);
      }
    }

    document.getElementById('public-return').addEventListener('click', event => {
      if (isEmbedded) {
        event.preventDefault();
        window.parent.postMessage({ type: 'close-aigc-review' }, location.origin);
        return;
      }
      try {
        sessionStorage.setItem('portfolioReviewReturn', 'gallery');
        sessionStorage.setItem('lin-portfolio-intro-seen', '1');
      } catch {}
    });

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const tokenSecondsRemaining = token => token ? token.expires - Math.floor(Date.now() / 1000) : 0;

    async function requestVideoToken(videoId, force = false) {
      const cached = tokenCache.get(videoId);
      if (!force && cached && tokenSecondsRemaining(cached) > TOKEN_REFRESH_THRESHOLD_SECONDS) return cached;
      if (tokenRequests.has(videoId)) return tokenRequests.get(videoId);

      const requestPromise = (async () => {
        const response = await fetch('/api/video-token', {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoId }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          requestLogin();
          throw new Error('登录已失效。');
        }
        if (!response.ok) throw new Error(data.error || '暂时无法获取播放地址。');
        const token = { videoUrl: data.videoUrl, expires: Number(data.expires) };
        tokenCache.set(videoId, token);
        lastSessionActivity = Date.now();
        return token;
      })().finally(() => tokenRequests.delete(videoId));

      tokenRequests.set(videoId, requestPromise);
      return requestPromise;
    }

    function scheduleActiveTokenRefresh() {
      window.clearTimeout(activeTokenRefreshTimer);
      if (!activeItem || !activeToken || !dialog.open) return;
      const delay = Math.max(1000, (tokenSecondsRemaining(activeToken) - TOKEN_REFRESH_THRESHOLD_SECONDS) * 1000);
      activeTokenRefreshTimer = window.setTimeout(() => refreshActiveVideoToken(true), delay);
    }

    function applyVideoToken(token, preservePosition = false) {
      const previousTime = preservePosition && Number.isFinite(player.currentTime) ? player.currentTime : 0;
      const shouldResume = preservePosition && !player.paused && !player.ended;
      activeToken = token;
      player.src = token.videoUrl;
      player.load();
      if (preservePosition) {
        player.addEventListener('loadedmetadata', () => {
          if (previousTime > 0 && Number.isFinite(player.duration)) {
            player.currentTime = Math.min(previousTime, Math.max(0, player.duration - 0.25));
          }
          if (shouldResume) player.play().catch(() => {});
        }, { once: true });
      }
      scheduleActiveTokenRefresh();
    }

    async function refreshActiveVideoToken(force = false) {
      if (!activeItem || !dialog.open || refreshingActiveToken) return;
      if (!force && tokenSecondsRemaining(activeToken) > TOKEN_REFRESH_THRESHOLD_SECONDS) {
        scheduleActiveTokenRefresh();
        return;
      }
      refreshingActiveToken = true;
      const refreshingId = activeItem.id;
      try {
        const token = await requestVideoToken(refreshingId, true);
        if (!activeItem || activeItem.id !== refreshingId || !dialog.open) return;
        applyVideoToken(token, true);
      } catch (error) {
        if (error.message !== '登录已失效。') {
          window.clearTimeout(activeTokenRefreshTimer);
          activeTokenRefreshTimer = window.setTimeout(() => refreshActiveVideoToken(true), 30 * 1000);
        }
      } finally {
        refreshingActiveToken = false;
      }
    }

    async function openVideo(item, button) {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      try {
        const token = await requestVideoToken(item.id);
        activeItem = item;
        playerTitle.textContent = item.title;
        applyVideoToken(token);
        dialog.showModal();
        scheduleActiveTokenRefresh();
        player.play().catch(() => {});
      } catch (error) {
        if (error.message !== '登录已失效。') notice.textContent = error.message;
      } finally {
        button.disabled = false;
        button.removeAttribute('aria-busy');
      }
    }

    function render(items) {
      grid.innerHTML = items.map((item, index) => `
        <article class="card">
          <button class="preview" type="button" data-index="${index}" aria-label="播放 ${escapeHtml(item.title)}">
            <img src="${escapeHtml(item.posterUrl)}" alt="" loading="${index < 2 ? 'eager' : 'lazy'}" decoding="async">
            <span class="badges"><span class="badge">AI生成/合成内容</span>${item.unofficial ? '<span class="badge alt">非官方个人练习</span>' : ''}</span>
            <span class="play" aria-hidden="true"></span>
          </button>
          <div class="copy"><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.description)}</p></div>
        </article>
      `).join('');

      grid.querySelectorAll('.preview').forEach(button => {
        button.addEventListener('click', () => openVideo(items[Number(button.dataset.index)], button));
      });
    }

    async function loadLibrary() {
      const response = await fetch('/api/review-library', { credentials: 'same-origin', cache: 'no-store' });
      if (response.status === 401) {
        requestLogin();
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '暂时无法载入受限内容。');
      lastSessionActivity = Date.now();
      document.body.classList.add('is-authorized');
      notice.textContent = data.notice;
      loading.hidden = true;
      render(data.items || []);
    }

    async function renewSessionIfNeeded() {
      if (document.hidden || Date.now() - lastSessionActivity < SESSION_HEARTBEAT_INTERVAL) return;
      const response = await fetch('/api/review-session', { credentials: 'same-origin', cache: 'no-store' });
      if (response.status === 401) {
        requestLogin();
        return;
      }
      if (response.ok) lastSessionActivity = Date.now();
    }

    function closePlayer() {
      window.clearTimeout(activeTokenRefreshTimer);
      activeItem = null;
      activeToken = null;
      refreshingActiveToken = false;
      player.pause();
      player.removeAttribute('src');
      player.load();
      dialog.close();
    }

    document.getElementById('close-player').addEventListener('click', closePlayer);
    dialog.addEventListener('click', event => { if (event.target === dialog) closePlayer(); });
    dialog.addEventListener('cancel', event => { event.preventDefault(); closePlayer(); });
    player.addEventListener('contextmenu', event => event.preventDefault());
    player.addEventListener('seeking', () => {
      if (activeToken && tokenSecondsRemaining(activeToken) <= TOKEN_REFRESH_THRESHOLD_SECONDS) {
        refreshActiveVideoToken(true);
      }
    });
    player.addEventListener('error', () => {
      if (activeItem && dialog.open && !refreshingActiveToken) refreshActiveVideoToken(true);
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renewSessionIfNeeded().catch(() => {});
    });
    window.setInterval(() => renewSessionIfNeeded().catch(() => {}), SESSION_HEARTBEAT_INTERVAL);

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/review-logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
      tokenCache.clear();
      if (isEmbedded) {
        window.parent.postMessage({ type: 'review-session-expired' }, location.origin);
      } else {
        location.replace('/review-login/');
      }
    });

    loadLibrary().catch(error => {
      document.body.classList.add('is-authorized');
      loading.className = 'error';
      loading.textContent = error.message;
      notice.textContent = '受限内容未能加载。';
    });
  </script>
</body>
</html>
