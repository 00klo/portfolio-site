      if (sessionStorage.getItem('portfolioReviewReturn') === 'gallery') {

  <style>
    html { background: #050505; }
    html.review-return-pending body {
      opacity: 0;
      pointer-events: none;
      animation: review-return-fallback 1ms 2.5s forwards;
    }
    @keyframes review-return-fallback {
      to { opacity: 1; pointer-events: auto; }
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #2a1b3d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #A855F7; }
    .static-icp-footer {
      position: relative;
      z-index: 10;
      visibility: hidden;
      opacity: 0;
      padding: 0 24px calc(24px + env(safe-area-inset-bottom));
      background: #000;
      color: rgba(255, 255, 255, 0.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      transition: opacity 180ms ease;
      animation: static-icp-fallback 180ms ease 12s forwards;
    }
    html.site-intro-complete .static-icp-footer {
      visibility: visible;
      opacity: 1;
      animation: none;
    }
    @keyframes static-icp-fallback {
      to {
        visibility: visible;
        opacity: 1;
      }
    }
    .static-icp-footer a {
      color: inherit;
      text-decoration: none;
      transition: color 180ms ease;
    }
    .static-icp-footer__links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
    }
    .static-icp-footer__separator {
      color: rgba(255, 255, 255, 0.2);
    }
    .static-icp-footer__police {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .static-icp-footer__badge {
      width: 16px;
      height: 18px;
      object-fit: contain;
      flex: 0 0 auto;
    }
    .static-icp-footer a:hover,
    .static-icp-footer a:focus-visible {
      color: #CCFF00;
    }
  </style>
