    <rect x="28" y="72" width="294" height="102" rx="18" fill="#09090d" fill-opacity=".72"/>
    <path d="M52 143l46-32 39 20 54-58 44 39 62-28 41 52" fill="none" stroke="#ccff00" stroke-opacity=".78" stroke-width="3"/>
    <rect x="28" y="191" width="124" height="8" rx="4" fill="#ffffff" fill-opacity=".15"/>
    <rect x="166" y="191" width="76" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
  </g>

  <g filter="url(#shadow)" transform="translate(472 72)">
