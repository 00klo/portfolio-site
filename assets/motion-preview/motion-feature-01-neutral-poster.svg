    <rect x="30" y="30" width="112" height="12" rx="6" fill="#ffffff" fill-opacity=".2"/>
    <rect x="30" y="64" width="334" height="104" rx="20" fill="#ffffff" fill-opacity=".045"/>
    <circle cx="82" cy="116" r="25" fill="#7c3aed" fill-opacity=".65"/>
    <rect x="124" y="96" width="180" height="10" rx="5" fill="#ffffff" fill-opacity=".22"/>
    <rect x="124" y="122" width="126" height="8" rx="4" fill="#ffffff" fill-opacity=".1"/>
    <rect x="30" y="194" width="96" height="76" rx="18" fill="#ccff00" fill-opacity=".12"/>
    <rect x="149" y="194" width="96" height="76" rx="18" fill="#ffffff" fill-opacity=".05"/>
    <rect x="268" y="194" width="96" height="76" rx="18" fill="#ffffff" fill-opacity=".05"/>
  </g>

  <g filter="url(#shadow)" transform="translate(904 170)">
